version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: cp2app-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cp2app
      MYSQL_USER: cp2app
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password"]

volumes:
  dbdata:
